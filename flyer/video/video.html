<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Video · Páginas web para comercios y emprendedores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* La misma paleta que el flyer y la página de trabajos: crema, casi negro y naranja */
  :root { --fondo:#faf7f2; --tinta:#17171b; --suave:#5f5e66; --acento:#ff5a1f; --fuerte:#e2470f; --cian:#d9480f; --wa:#25d366 }
  * { box-sizing:border-box; margin:0; padding:0 }
  body { width:1080px; height:1920px; overflow:hidden; position:relative; background:var(--fondo); color:var(--tinta);
         font-family:"Inter",sans-serif; -webkit-font-smoothing:antialiased }
  .fondo { position:absolute; inset:0;
    background: radial-gradient(900px 700px at 15% 0%, rgba(255,90,31,.16), transparent 60%),
                radial-gradient(800px 700px at 100% 100%, rgba(255,184,77,.2), transparent 60%) }
  .estrellas { display:none; position:absolute; inset:0; background-image:
    radial-gradient(2px 2px at 120px 220px, #fff8, transparent), radial-gradient(1.5px 1.5px at 820px 140px, #fff7, transparent),
    radial-gradient(2px 2px at 960px 760px, #fff6, transparent), radial-gradient(1.5px 1.5px at 60px 1300px, #fff7, transparent),
    radial-gradient(2px 2px at 540px 1820px, #fff6, transparent), radial-gradient(1.5px 1.5px at 1000px 1500px, #fff8, transparent),
    radial-gradient(1.5px 1.5px at 300px 980px, #fff5, transparent), radial-gradient(2px 2px at 700px 420px, #fff5, transparent) }

  .capa { position:absolute; inset:0; will-change:opacity, transform }
  .firma { position:absolute; top:84px; left:80px; right:80px; display:flex; justify-content:space-between; align-items:center }
  .firma b { font-family:"Space Grotesk"; font-size:38px }
  .firma span { font-family:"JetBrains Mono"; font-size:24px; letter-spacing:.22em; color:var(--cian); border:2px solid rgba(255,90,31,.45); border-radius:99px; padding:10px 24px }

  /* Portada */
  .portada { display:flex; flex-direction:column; justify-content:center; padding:0 80px }
  .portada h1 { font-family:"Space Grotesk"; font-weight:700; font-size:150px; line-height:.95; letter-spacing:-.03em }
  .degrade { background:linear-gradient(100deg,#ff5a1f 0%,#ff7a2e 55%,#f59e0b 100%); -webkit-background-clip:text; background-clip:text; color:transparent }
  .portada p { margin-top:48px; font-size:46px; line-height:1.25; color:var(--suave); max-width:860px }

  /* Escenas con el celular */
  .rotulo { position:absolute; top:200px; left:80px; right:80px }
  .chip { display:inline-block; font-family:"JetBrains Mono"; font-size:26px; letter-spacing:.14em; text-transform:uppercase; padding:10px 22px; border-radius:99px }
  .chip.cliente { color:#14713a; background:#d3f0dc; border:2px solid #a9dfba }
  .chip.ejemplo { color:#1d5f86; background:#d4e8f3; border:2px solid #a8cde3 }
  .rotulo h2 { margin-top:26px; font-family:"Space Grotesk"; font-weight:700; font-size:78px; line-height:1.02; letter-spacing:-.02em }
  .celular { position:absolute; left:50%; top:560px; width:600px; height:1298px; margin-left:-300px; border-radius:76px; padding:18px;
             background:#1c1c22; box-shadow:0 0 0 3px #2a2a33, 0 60px 110px -30px rgba(23,23,27,.55) }
  .celular .pantalla { position:relative; width:100%; height:100%; border-radius:60px; overflow:hidden; background:#000 }
  .celular img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0 }
  .celular .muesca { position:absolute; top:22px; left:50%; width:170px; height:44px; margin-left:-85px; border-radius:99px; background:#000; z-index:2 }

  /* Cierre */
  .cierre { display:flex; flex-direction:column; justify-content:center; padding:0 80px }
  .cierre small { font-family:"JetBrains Mono"; font-size:30px; letter-spacing:.2em; text-transform:uppercase; color:var(--cian) }
  .cierre h2 { margin-top:24px; font-family:"Space Grotesk"; font-weight:700; font-size:170px; line-height:.92; letter-spacing:-.03em }
  .cierre .texto { margin-top:30px; font-size:46px; color:var(--suave) }
  .contacto { margin-top:90px; display:grid; gap:34px }
  .contacto div { display:flex; align-items:center; gap:28px; font-family:"Space Grotesk"; font-weight:700; font-size:64px }
  .contacto .web { font-family:"JetBrains Mono"; font-weight:500; font-size:46px; color:var(--suave) }
  .contacto svg { width:78px; height:78px; flex:none }
</style>
</head>
<body>
<div class="fondo"></div>
<div class="estrellas"></div>
<div class="firma"><b>Matías Trovato</b><span>PÁGINAS WEB</span></div>

<div class="capa portada" id="portada">
  <h1>Tu comercio, <span class="degrade">con página propia.</span></h1>
  <p>Hecha a medida, pensada para el celular y con los pedidos directo a tu WhatsApp.</p>
</div>

<div class="capa" id="escenas">
  <div class="rotulo">
    <span class="chip" id="chip"></span>
    <h2 id="frase"></h2>
  </div>
  <div class="celular" id="celular">
    <div class="pantalla">
      <div class="muesca"></div>
      <img id="toma-autoshine" alt="">
      <img id="toma-cabanas" alt="">
      <img id="toma-casa-tala" alt="">
    </div>
  </div>
</div>

<div class="capa cierre" id="cierre">
  <small>Presupuesto sin compromiso</small>
  <h2>Escribime</h2>
  <p class="texto">y te paso el precio según lo que necesites.</p>
  <div class="contacto">
    <div><svg viewBox="0 0 32 32" fill="#25d366"><path d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.9 2 7L3 29l6.4-2c2 1.1 4.3 1.7 6.6 1.7 7.2 0 13-5.7 13-12.8S23.2 3 16 3zm0 23.4c-2.1 0-4.1-.6-5.9-1.6l-.4-.3-3.8 1.2 1.2-3.7-.3-.4c-1.2-1.8-1.8-3.8-1.8-5.9C5 10 9.9 5.2 16 5.2S27 10 27 15.9 22.1 26.4 16 26.4zm6-7.8c-.3-.2-1.9-1-2.2-1.1-.3-.1-.5-.2-.7.2-.2.3-.8 1.1-1 1.3-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.3-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.3.3-.6.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.8 5 .8.3 1.4.5 1.9.7.8.3 1.5.2 2.1.1.6-.1 1.9-.8 2.2-1.5.3-.7.3-1.3.2-1.5-.1-.2-.3-.3-.6-.5z"/></svg>2656 445537</div>
    <div class="web"><svg viewBox="0 0 32 32" fill="none" stroke="#ff5a1f" stroke-width="2.4"><circle cx="16" cy="16" r="11.5"/><path d="M4.5 16h23M16 4.5c3.6 3.2 5.4 7 5.4 11.5s-1.8 8.3-5.4 11.5c-3.6-3.2-5.4-7-5.4-11.5S12.4 7.7 16 4.5z"/></svg>matiastrovato.pages.dev</div>
  </div>
</div>

<script>
// La línea de tiempo entera sale de pintar(t): un cuadro por llamada, sin animaciones sueltas,
// así cada cuadro del video es exacto y se puede rehacer igual.
// Cada toma dura lo que grabó grabar.py (1,5 s quieta + 4 tramos de 2 s = 285 cuadros) menos el arranque que se salta
const CUADROS = 285, SALTA = 0.6, ESCENA = CUADROS / 30 - SALTA, INICIO = 2.6;
const ESCENAS = [
  { toma: "autoshine", chip: "cliente", chipTexto: "Cliente · autoshine.com.ar", frase: "Los turnos le llegan directo al WhatsApp." },
  { toma: "cabanas", chip: "ejemplo", chipTexto: "Página de ejemplo", frase: "Consultas de fechas sin pagar comisión." },
  { toma: "casa-tala", chip: "ejemplo", chipTexto: "Página de ejemplo", frase: "La carta en el celular, de día y de noche." },
].map((e, i) => ({ ...e, desde: INICIO + i * ESCENA, hasta: INICIO + (i + 1) * ESCENA }));
const FIN = ESCENAS[ESCENAS.length - 1].hasta;
const DURACION = FIN + 3.6;
const suave = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
const tramo = (t, a, b) => suave((t - a) / (b - a));

async function pintar(t) {
  const $ = (id) => document.getElementById(id);
  // Portada: entra, se queda y se va hacia arriba cuando sube el celular
  const portadaSale = tramo(t, 2.1, 2.7);
  $("portada").style.opacity = String(tramo(t, 0, 0.5) * (1 - portadaSale));
  $("portada").style.transform = `translateY(${(1 - tramo(t, 0, 0.6)) * 40 - portadaSale * 120}px)`;

  // Escenas: el celular sube, cambian la frase y la toma, y al final baja para el cierre
  const entra = tramo(t, 2.2, 2.9), sale = tramo(t, FIN - 0.3, FIN + 0.3);
  $("escenas").style.opacity = String(entra * (1 - sale));
  $("celular").style.transform = `translateY(${(1 - entra) * 700 + sale * 300}px)`;
  const actual = ESCENAS.find((e) => t >= e.desde && t < e.hasta) || (t < INICIO ? ESCENAS[0] : ESCENAS[ESCENAS.length - 1]);
  $("chip").className = "chip " + actual.chip;
  $("chip").textContent = actual.chipTexto;
  $("frase").textContent = actual.frase;
  // La frase entra un poco después de cada corte
  const enEscena = t - actual.desde;
  $("frase").style.opacity = String(tramo(enEscena, 0.05, 0.45));
  $("frase").style.transform = `translateY(${(1 - tramo(enEscena, 0.05, 0.45)) * 30}px)`;

  const cargas = [];
  for (const e of ESCENAS) {
    const img = $("toma-" + e.toma);
    const visible = e === actual;
    img.style.opacity = visible ? "1" : "0";
    if (visible) {
      // A velocidad real: arranca casi al final de la portada quieta y sigue con los tramos
      const segundo = SALTA + (t - e.desde);
      const n = Math.max(1, Math.min(CUADROS, Math.round(segundo * 30)));
      const src = `cuadros/${e.toma}/${String(n).padStart(4, "0")}.jpg`;
      if (!img.src.endsWith(src)) {
        img.src = src;
        cargas.push(img.decode().catch(() => {}));
      }
    }
  }

  // Cierre con el contacto
  const cierre = tramo(t, FIN + 0.1, FIN + 0.8);
  $("cierre").style.opacity = String(cierre);
  $("cierre").style.transform = `translateY(${(1 - cierre) * 50}px)`;

  await Promise.all(cargas);
  await document.fonts.ready;
}
window.pintar = pintar;
window.DURACION = DURACION;
</script>
</body>
</html>
