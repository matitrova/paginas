<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Propuesta para mostrarle a Castro Inmobiliaria: no es su página oficial y no se indexa -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f3ece2" />
    <title>Castro Inmobiliaria · Villa de Merlo, San Luis · Propuesta</title>
    <meta name="description" content="Propuesta de Matías Trovato para el sitio nuevo de Castro Inmobiliaria, Villa de Merlo, San Luis. No es la página oficial." />
    <link rel="icon" href="./fotos/favicon.png" />
    <meta property="og:title" content="Castro Inmobiliaria · Así podría ser su página nueva" />
    <meta property="og:description" content="Propuesta de Matías Trovato: sus 272 propiedades, sus urbanizaciones y 88 terrenos con su forma real. No es la página oficial." />
    <meta property="og:image" content="https://matitrova.github.io/paginas/propuestas/castro-inmobiliaria/fotos/og.jpg" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://static.tokkobroker.com" />
    <script>
      // Al pasar de una pantalla a otra, a veces el navegador se saltea la animación (si la nueva tarda en dibujarse). La
      // página cambia igual: no es un error, así que no se anota en la consola
      addEventListener("unhandledrejection", (e) => {
        if (e.reason?.name === "AbortError" && e.reason.message === "Transition was skipped") e.preventDefault();
      });
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
